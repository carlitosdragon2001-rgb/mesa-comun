# Configuración de despliegue para Render (https://render.com).
# Con este fichero en el repositorio, Render crea el servicio sin tener que
# rellenar nada a mano: "New → Blueprint" y apuntar al repo.
services:
  - type: web
    name: mesa-comun
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt # el más cercano a España de los disponibles en el plan gratuito
    healthCheckPath: /estado
    autoDeploy: true
